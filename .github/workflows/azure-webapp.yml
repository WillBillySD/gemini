name: Deploy to Azure Web App

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linters (ruff + black)
        run: |
          python -m pip install ruff black
          ruff check src || true
          black --check . || true

      - name: Zip application
        run: |
          zip -r deploy.zip . -x ".git/*" "*.pyc" "__pycache__/*" "data/*.db"

      - name: Set App Settings (Twilio + Flask)
        if: secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' || secrets.AZURE_CREDENTIALS != ''
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az webapp config appsettings set \
              --name ${{ secrets.APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RG }} \
              --settings \
                TWILIO_ACCOUNT_SID="${{ secrets.TWILIO_ACCOUNT_SID }}" \
                TWILIO_AUTH_TOKEN="${{ secrets.TWILIO_AUTH_TOKEN }}" \
                TWILIO_FROM_NUMBER="${{ secrets.TWILIO_FROM_NUMBER }}" \
                ALERT_TO_NUMBER="${{ secrets.ALERT_TO_NUMBER }}" \
                CHECK_INTERVAL_MINUTES="${{ secrets.CHECK_INTERVAL_MINUTES || '30' }}" \
                SECRET_KEY="${{ secrets.SECRET_KEY }}"

      - name: Deploy with publish profile
        if: secrets.AZURE_WEBAPP_PUBLISH_PROFILE != ''
        uses: azure/webapps-deploy@v4
        with:
          app-name: ${{ secrets.APP_NAME }}
          package: deploy.zip
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

      - name: Login with Azure credentials
        if: secrets.AZURE_CREDENTIALS != ''
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy using logged-in account
        if: secrets.AZURE_CREDENTIALS != '' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE == ''
        uses: azure/webapps-deploy@v4
        with:
          app-name: ${{ secrets.APP_NAME }}
          package: deploy.zip
