name: Deploy to Azure Web App

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linters (ruff + black)
        run: |
          python -m pip install ruff black
          ruff check src || true
          black --check . || true

      - name: Zip application
        run: |
          zip -r deploy.zip . -x ".git/*" "*.pyc" "__pycache__/*"

      - name: Deploy with publish profile
        if: secrets.AZURE_WEBAPP_PUBLISH_PROFILE != ''
        uses: azure/webapps-deploy@v4
        with:
          app-name: ${{ secrets.APP_NAME }}
          package: deploy.zip
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

      - name: Login with Azure credentials
        if: secrets.AZURE_CREDENTIALS != ''
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy using logged-in account
        if: secrets.AZURE_CREDENTIALS != '' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE == ''
        uses: azure/webapps-deploy@v4
        with:
          app-name: ${{ secrets.APP_NAME }}
          package: deploy.zip
