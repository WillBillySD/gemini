name: Daily AI Brief

on:
  schedule:
    # Run twice to handle DST shifts for America/Chicago; DB prevents double-send.
    - cron: "5 9 * * *"
    - cron: "5 10 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run newsletter
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          FROM_NAME: ${{ vars.FROM_NAME }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          TO_EMAIL: ${{ vars.TO_EMAIL }}
          TOP_N: ${{ vars.TOP_N }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          FEED_URLS: ${{ vars.FEED_URLS }}
        run: |
          python -m src.main

      - name: Commit database
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data/newsletter.db
          git commit -m "Update database [skip ci]" || echo "No changes to commit"
          git push
